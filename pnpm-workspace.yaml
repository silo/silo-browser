# pnpm settings. pnpm 11+ no longer reads the "pnpm" field in package.json.
# The pnpm version itself is pinned via "packageManager" in package.json.
shamefullyHoist: true

# Dependencies allowed to run install scripts (pnpm fails on unlisted ones)
allowBuilds:
  esbuild: true
  sharp: true
  electron-winstaller: false

# pnpm refuses packages published less than 24h ago (minimumReleaseAge).
# Exact-version exceptions (e.g. `- electron@45.2.3`) for a release that can't
# wait. Remove each entry once that version is older than 24h; the weekly
# update check does this.
minimumReleaseAgeExclude:
  # 45.3.1 (2026-11-12): cert distrust + notification leak fixes; remove after 2026-11-13 02:10 UTC
  - electron@45.3.1
